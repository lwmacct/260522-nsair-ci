name: Test NSCell VM workloads

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Incus VM OCI artifact to import
        required: true
        default: ghcr.io/lwmacct/260522-nscell-ci:nscell-test-ubuntu24.04-amd64-vm
        type: string
      nscell_ref:
        description: nscell repository ref to build
        required: true
        default: main
        type: string
      workloads:
        description: Space-separated workload names, or all
        required: true
        default: procfs-cpu
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: nscell-vm-workloads-${{ github.ref }}-${{ inputs.workloads || 'procfs-cpu' }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test-nscell-vm-reusable.yml
    with:
      image_ref: ${{ inputs.image_ref || 'ghcr.io/lwmacct/260522-nscell-ci:nscell-test-ubuntu24.04-amd64-vm' }}
      nscell_ref: ${{ inputs.nscell_ref || 'main' }}
      test_mode: workloads
      workloads: ${{ inputs.workloads || 'procfs-cpu' }}
    permissions:
      contents: read
      packages: read
