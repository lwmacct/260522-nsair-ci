name: Build NSCell test VM image

on:
  push:
    branches:
      - main
    paths:
      - images/test-vm.yaml
      - .github/workflows/build-test-vm-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nscell-test-vm-image-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  OCI_REPOSITORY: ghcr.io/${{ github.repository }}
  DISTROBUILDER_VERSION: 3.3.1
  DISTROBUILDER_CACHE_VERSION: 1
  ORAS_VERSION: 1.3.3
  RELEASE: noble
  ARCHITECTURE: amd64
  VARIANT: default

jobs:
  build:
    name: Ubuntu 24.04 / amd64 / VM
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.25.6"

      - name: Cache distrobuilder ${{ env.DISTROBUILDER_VERSION }}
        uses: actions/cache@v4.2.4
        with:
          path: ${{ runner.temp }}/distrobuilder-cache
          key: distrobuilder-${{ runner.os }}-amd64-${{ env.DISTROBUILDER_VERSION }}-go1.25.6-v${{ env.DISTROBUILDER_CACHE_VERSION }}

      - name: Install Incus from Zabbly and build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            btrfs-progs \
            build-essential \
            ca-certificates \
            curl \
            debootstrap \
            dnsmasq-base \
            dosfstools \
            gdisk \
            gpg \
            gpg-agent \
            jq \
            ovmf \
            qemu-system-modules-spice \
            qemu-system-x86 \
            qemu-utils \
            rsync \
            squashfs-tools \
            xz-utils \
            zstd
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL https://pkgs.zabbly.com/key.asc \
            -o /etc/apt/keyrings/zabbly.asc
          sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.sources >/dev/null <<EOF
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/stable
          Suites: $(. /etc/os-release && echo "${VERSION_CODENAME}")
          Components: main
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/zabbly.asc
          EOF
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends incus
          apt-cache policy incus
          apt-cache policy incus | grep -q 'https://pkgs.zabbly.com/incus/stable'

      - name: Build and install distrobuilder ${{ env.DISTROBUILDER_VERSION }}
        env:
          GOFLAGS: >-
            -tags=containers_image_storage_stub,containers_image_docker_daemon_stub,containers_image_openpgp
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/distrobuilder-cache"
          if [ ! -x "${RUNNER_TEMP}/distrobuilder-cache/distrobuilder" ]; then
            GOBIN="${RUNNER_TEMP}/distrobuilder-cache" \
              go install "github.com/lxc/distrobuilder/v3/distrobuilder@v${DISTROBUILDER_VERSION}"
          fi
          sudo install -m 0755 \
            "${RUNNER_TEMP}/distrobuilder-cache/distrobuilder" \
            /usr/local/bin/distrobuilder
          distrobuilder --version

      - name: Setup ORAS ${{ env.ORAS_VERSION }}
        uses: oras-project/setup-oras@v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image definition
        run: |
          set -euo pipefail
          sudo distrobuilder validate images/test-vm.yaml

      - name: Build Incus VM image
        run: |
          set -euo pipefail
          echo "SERIAL=$(date -u +%Y%m%d_%H%M)" >> "${GITHUB_ENV}"
          echo "OUTPUT_DIR=${RUNNER_TEMP}/nscell-test-vm-image" >> "${GITHUB_ENV}"
          sudo mkdir -p "${RUNNER_TEMP}/nscell-test-vm-image"
          sudo distrobuilder build-incus \
            images/test-vm.yaml \
            "${RUNNER_TEMP}/nscell-test-vm-image" \
            --type=split \
            --compression=xz \
            --vm \
            --timeout=5400 \
            -o image.architecture="${ARCHITECTURE}" \
            -o image.release="${RELEASE}" \
            -o image.variant="${VARIANT}" \
            -o image.description="NSCell test Ubuntu 24.04 AMD64 VM" \
            -o image.serial="$(date -u +%Y%m%d_%H%M)" \
            -o source.url="http://archive.ubuntu.com/ubuntu/"
          sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/nscell-test-vm-image"

      - name: Check VM artifact files
        run: |
          set -euo pipefail
          test -s "${OUTPUT_DIR}/incus.tar.xz"
          test -s "${OUTPUT_DIR}/disk.qcow2"
          qemu-img check "${OUTPUT_DIR}/disk.qcow2"

      - name: Write checksums
        run: |
          set -euo pipefail
          (
            cd "${OUTPUT_DIR}"
            sha256sum incus.tar.xz disk.qcow2 > SHA256SUMS
          )

      - name: Publish Incus VM image to GHCR with ORAS
        env:
          ORAS_ARTIFACT_TYPE_VM: application/vnd.linuxcontainers.incus.virtual-machine-image.v1
          ORAS_METADATA_TYPE: application/vnd.linuxcontainers.incus.metadata.v1+tar+xz
          ORAS_DISK_TYPE: application/vnd.linuxcontainers.incus.disk.v1+qcow2
          ORAS_CHECKSUM_TYPE: text/plain
        run: |
          set -euo pipefail
          _tag="nscell-test-ubuntu24.04-${ARCHITECTURE}-vm-${SERIAL}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          _stable_tag="nscell-test-ubuntu24.04-${ARCHITECTURE}-vm"
          (
            cd "${OUTPUT_DIR}"
            oras push \
              --artifact-type "${ORAS_ARTIFACT_TYPE_VM}" \
              --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "org.opencontainers.image.version=${SERIAL}" \
              --annotation "org.opencontainers.image.description=NSCell test Ubuntu 24.04 AMD64 Incus VM" \
              "${OCI_REPOSITORY}:${_tag}" \
              "incus.tar.xz:${ORAS_METADATA_TYPE}" \
              "disk.qcow2:${ORAS_DISK_TYPE}" \
              "SHA256SUMS:${ORAS_CHECKSUM_TYPE}"
          )
          oras tag "${OCI_REPOSITORY}:${_tag}" "${_stable_tag}"
          {
            echo "## Published NSCell test VM image"
            echo
            echo "- Stable: \`${OCI_REPOSITORY}:${_stable_tag}\`"
            echo "- Build: \`${OCI_REPOSITORY}:${_tag}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
