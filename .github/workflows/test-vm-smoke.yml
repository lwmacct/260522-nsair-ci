name: Test NSCell VM smoke

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Incus VM OCI artifact to import
        required: true
        default: ghcr.io/lwmacct/260522-nscell-ci:nscell-test-ubuntu24.04-amd64-vm
        type: string
      nscell_image:
        description: GHCR image containing the nscell binary
        required: true
        default: ghcr.io/lwmacct/260522-nscell:latest
        type: string
permissions:
  contents: read
  packages: read

concurrency:
  group: nscell-vm-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test-vm-reusable.yml
    with:
      image_ref: ${{ inputs.image_ref || 'ghcr.io/lwmacct/260522-nscell-ci:nscell-test-ubuntu24.04-amd64-vm' }}
      nscell_image: ${{ inputs.nscell_image || 'ghcr.io/lwmacct/260522-nscell:latest' }}
      test_mode: smoke
      workloads: procfs-cpu
    permissions:
      contents: read
      packages: read
