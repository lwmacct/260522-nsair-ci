name: Nested VM Probe

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted x86_64 runner label
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-26.04

concurrency:
  group: nested-vm-probe-${{ inputs.runner || 'ubuntu-24.04' }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: Probe ${{ inputs.runner || 'ubuntu-24.04' }}
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      PROBE_LOG_DIR: /tmp/nested-vm-probe
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install probe dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            busybox-static \
            cpio \
            linux-image-virtual \
            qemu-system-x86

      - name: Boot KVM guest and probe BPF LSM
        run: sudo env PROBE_LOG_DIR="$PROBE_LOG_DIR" bash scripts/nested-vm-probe.sh

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nested-vm-probe-${{ inputs.runner || 'ubuntu-24.04' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROBE_LOG_DIR }}/**
          if-no-files-found: ignore
